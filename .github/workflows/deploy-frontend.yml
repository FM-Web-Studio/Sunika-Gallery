name: Deploy Gallery to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npx vitest run

      # The sendMessage function refuses calls without App Check, so a build without the key
      # would ship a contact form that always fails.
      - name: Check the App Check key is set
        run: |
          if [ -z "$FIREBASE_APPCHECK_SITE_KEY" ]; then
            echo "::error::Secret FIREBASE_APPCHECK_SITE_KEY is empty. Add the reCAPTCHA Enterprise site key (Google Cloud > Fraud Defense), then run this workflow again."
            exit 1
          fi
        env:
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          ADMIN_EMAILS:                 ${{ secrets.ADMIN_EMAILS }}
          FIREBASE_APPCHECK_SITE_KEY:   ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      # The contact form posts to sendMessage, and hearts and ratings go through voteArtwork, both
      # deployed from the Sunika-Portfolio repo. Both must be live first or those features break.
      - name: Check the site's functions are deployed
        run: |
          # This call carries no App Check token, so a live function refuses it with 401 and saves
          # nothing. 404 means it is not deployed; 5xx means it is broken.
          for fn in sendMessage voteArtwork; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json'               -d '{"data":{}}' https://europe-west1-sunika-project.cloudfunctions.net/$fn)
            if [ "$status" != "401" ] && [ "$status" != "200" ]; then
              echo "::error::$fn answered $status. Deploy functions from the Sunika-Portfolio repo first, then run this workflow again."
              exit 1
            fi
          done

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:gallery --project sunika-project
